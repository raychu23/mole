name: mole-team-server
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mole
      POSTGRES_PASSWORD: mole
      POSTGRES_DB: mole
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel-collector.yaml"]
    ports: ["4318:4318"]

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: ["mlflow", "server", "--host", "0.0.0.0", "--backend-store-uri", "/mlruns"]
    volumes: ["./mlruns:/mlruns"]
    ports: ["5000:5000"]

  server:
    build:
      context: ../
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgresql://mole:mole@postgres:5432/mole
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports: ["3000:3000"]
    depends_on: [postgres, otel-collector]

volumes:
  pgdata:
