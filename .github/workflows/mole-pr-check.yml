# T32 (Team phase A, no server): on every pull request push, ONE check run named "mole" with the decision records whose
# scope covers the changed lines, the CODEOWNERS owners, past fixes and up to 3 questions; silent (neutral, no annotations)
# when nothing governs. Posted with the workflow's own token (checks: write); never a PR comment, never a bot account.
# Note: pull requests from forks get a read-only token, so the POST is refused there (GitHub's rule, not Mole's).
name: mole pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write

# at most one check run per push: a newer push cancels the run still working on the older one
concurrency:
  group: mole-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mole:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout (full history for the merge base, CODEOWNERS at the base, past fixes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: mole check
        uses: ./.github/actions/mole-check
        with:
          token: ${{ github.token }}
